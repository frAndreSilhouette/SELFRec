# training.set: ./dataset/yelp2018/train.txt

# test.set: ./dataset/yelp2018/test.txt
training.set: ./dataset/campus_data/campus_15_train.txt

test.set: ./dataset/campus_data/campus_15_test.txt

model:
  name: XSimGCL
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
max.epoch: 50
batch.size: 4096
learning.rate: 0.001
reg.lambda: 0.0001

XSimGCL:
  n_layer: 2
  l_star: 1
  lambda: 0.05
  eps: 0.1
  tau: 0.1

output: ./results/