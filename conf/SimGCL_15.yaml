training.set: ./dataset/campus_data/campus_15_train.txt

test.set: ./dataset/campus_data/campus_15_test.txt

model:
  name: SimGCL
  type: graph

item.ranking.topN: [3, 5, 10, 20]

embedding.size: 64
# max.epoch: 20
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

SimGCL:
  n_layer: 2
  lambda: 0.5
  eps: 0.1

output: ./results/SimGCL/campus_15/
