training.set: ./dataset/campus_data/campus_10_train.txt

test.set: ./dataset/campus_data/campus_10_test.txt

model:
  name: SGL
  type: graph

item.ranking.topN: [3, 5, 10, 20]

embedding.size: 64
# max.epoch: 20
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

SGL:
  n_layer: 2
  lambda: 0.1
  drop_rate: 0.1
  aug_type: 1
  temp: 0.2

output: ./results/SGL/campus_10/
