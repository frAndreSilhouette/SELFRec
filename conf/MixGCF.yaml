training.set: ./dataset/campus_data/campus_10_train.txt

test.set: ./dataset/campus_data/campus_10_test.txt

model:
  name: MixGCF
  type: graph

item.ranking.topN: [10,20]

embedding.size: 64
# max.epoch: 500
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001

MixGCF:
  n_layer: 3
  n_negs: 64

output: ./results/MixGCF/campus_10/
